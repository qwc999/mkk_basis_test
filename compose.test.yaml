# Standalone test stack. Use a separate Compose project with -p mkk-payments-test.
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: payments_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: payments_test
      TZ: UTC
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_test -d payments_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      target: tests
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://payments_test:test-only@postgres:5432/payments_test
    depends_on:
      postgres:
        condition: service_healthy
